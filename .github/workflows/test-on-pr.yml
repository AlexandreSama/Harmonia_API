name: CI – Tests, Sonar & Docker

on:
  # 1) PR vers la branche test
  pull_request:
    branches:
      - test
    types: [opened, synchronize, reopened]

  # 2) Push sur test pour builder et pousser l'image Docker
  push:
    branches:
      - test

env:
  TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
  TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
  TWILIO_API_SECRET: ${{ secrets.TWILIO_API_SECRET }}

jobs:
  test-and-sonar:
    if: github.head_ref == 'test-all'
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: harmonia
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Cache Sonar packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Wait for MySQL to be ready
        run: |
          echo "⏳ Waiting for MySQL..."
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -u root -proot --silent; then
              echo "✅ MySQL is up!"
              break
            fi
            echo "Still waiting for MySQL... ($i)"
            sleep 2
          done

      - name: Run unit & integration tests (no Selenium) & SonarQube analysis
        run: ./mvnw verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
          -Dsonar.projectKey=AlexandreSama_Harmonia_API \
          -Dsonar.organization=alexandresama \
          -Dtest=\!**/*Selenium*Test
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/harmonia
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root

      - name: Upload artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-api.jar
          path: target/*.jar
          retention-days: 1

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test-and-sonar
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/harmonia-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/harmonia-api:${{ github.sha }}

      - name: Success message
        run: |
          echo "✅ Image Docker publiée sur DockerHub : ${{ secrets.DOCKERHUB_USERNAME }}/harmonia-api:latest"

  discord_notif:
    name: Discord
    runs-on: ubuntu-latest
    needs: [test-and-sonar, build-and-push]
    continue-on-error: true
    if: always()

    steps:
    - name: Notify success on Discord
      if: needs.test-and-sonar.result == 'success'
      uses: sarisia/actions-status-discord@v1
      with:
        webhook: ${{ secrets.DISCORD_WEBHOOK }}
        status: success
        content: "Hey <@256892994504884224> 🎉 La PR a passé tous les tests !"
        title: "Tests OK ✅"
        description: "Tous les tests sur la Pull Request sont passés. Merge tranquille 🚀."
        image: ${{ secrets.EMBED_SUCCESS_URL }}
        color: 0x00ff00
        url: https://media.tenor.com/5TrjgGdczhQAAAAj/flexo3.gif
        username: GitHub Actions
        avatar_url: ${{ secrets.AVATAR_SUCCESS_URL }}

    - name: Notify failure on Discord
      if: needs.test-and-sonar.result == 'failure'
      uses: sarisia/actions-status-discord@v1
      with:
        webhook: ${{ secrets.DISCORD_WEBHOOK }}
        status: failure
        content: "Hey <@256892994504884224> ❌ Attention la PR a échoué !"
        title: "Tests FAILED ❌"
        description: "Certains tests ont échoué sur la Pull Request. Check le CI vite."
        image: ${{ secrets.EMBED_FAILURE_IMAGE }}
        color: 0xff0000
        url: https://media1.tenor.com/m/HZClb9KQ7o0AAAAd/pepe-rain-pepe-the-frog.gif
        username: GitHub Actions
        avatar_url: ${{ secrets.AVATAR_FAILURE_URL }}
